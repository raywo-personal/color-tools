name: Build and deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - redesign-v2
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - "main"
      - "redesign-v2"

permissions:
  contents: read

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:ci

      - name: Build the app
        run: pnpm run build:cloudflare

      - name: Upload build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/ColorTools/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name != 'pull_request'

    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/ColorTools/browser

      # The Pages project's production branch is main, so every other branch
      # listed above deploys as a preview under its own branch alias.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ColorTools/browser --project-name=color-tools --branch=${{ github.ref_name }}

      - name: Report the deployment URLs
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Deployed \`$BRANCH\`"
            echo ""
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Alias: $ALIAS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
