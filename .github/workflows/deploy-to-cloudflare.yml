name: Build and deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # run/** carries the issue pull requests of an academy-dev-core
  # run-issues run, which merges each one only once its checks pass.
  # Pull requests never deploy; see the deploy job's condition.
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - "main"
      - "run/**"

permissions:
  contents: read

jobs:
  build:
    name: Build the app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        # No `runtime`: the action installs the Node.js that
        # `devEngines.runtime` in package.json declares, so CI and a local
        # `pnpm install` run the same version.
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:ci

      - name: Run the MCP server tests
        run: pnpm run mcp:test

      - name: Build the app
        run: pnpm run build:cloudflare

      # After the app build: the dry run reads `assets.directory` and fails
      # when it does not exist yet.
      - name: Type-check and bundle the Worker
        run: |
          pnpm exec tsc -p functions/tsconfig.json --noEmit
          pnpm exec wrangler deploy --dry-run --outdir tmp/worker-build

      - name: Upload build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/ColorTools/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name != 'pull_request'

    steps:
      # `wrangler deploy` bundles the Worker from functions/ in the working
      # directory, and that bundle imports from node_modules - so the deploy
      # job needs the checkout and the dependencies, not just the built app.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        # No `runtime`: the action installs the Node.js that
        # `devEngines.runtime` in package.json declares, so CI and a local
        # `pnpm install` run the same version.
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/ColorTools/browser

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.SKILLBIRD_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.SKILLBIRD_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report the deployment URLs
        env:
          BRANCH: ${{ github.ref_name }}
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          {
            echo "### Deployed \`$BRANCH\`"
            echo ""
            grep -oE 'https://[^[:space:]]+' <<< "$OUTPUT" | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
