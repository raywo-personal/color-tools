<!-- The caption and the switch wrap rather than shrink: the two buttons keep
     their h-11 hit area at every width, so in the narrow column the switch
     moves below the caption instead of squeezing past the minimum. -->
<div class="mb-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
  <p class="font-sans text-sm tracking-widest text-dim">PLAY</p>

  <div class="flex overflow-hidden rounded-xs border border-line"
       role="group"
       aria-label="Slider color space">
    @for (option of spaceOptions; track option.value) {
      <!-- aria-pressed, not colour alone: the selected space is the only thing
           telling a visitor which three axes they are looking at. -->
      <button type="button"
              class="h-11 cursor-pointer px-5 font-sans text-base focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current"
              [class.bg-text]="space() === option.value"
              [class.text-bg]="space() === option.value"
              [class.text-text]="space() !== option.value"
              [attr.aria-pressed]="space() === option.value"
              (click)="selectSpace(option.value)">{{ option.label }}</button>
    }
  </div>
</div>

<div class="grid gap-4">
  @if (space() === "hsl") {
    <ct-color-slider label="HUE"
                     [min]="0"
                     [max]="hueMax"
                     [step]="1"
                     [value]="hslShown().h"
                     [valueText]="hslHueText()"
                     [track]="hslHueTrack()"
                     (valueChange)="hslHueChanged($event)"
                     (commit)="commit()"/>

    <ct-color-slider label="SATURATION"
                     [min]="0"
                     [max]="100"
                     [step]="1"
                     [value]="hslShown().s"
                     [valueText]="hslSaturationText()"
                     [track]="hslSaturationTrack()"
                     (valueChange)="hslSaturationChanged($event)"
                     (commit)="commit()"/>

    <ct-color-slider label="LIGHTNESS"
                     [min]="0"
                     [max]="100"
                     [step]="1"
                     [value]="hslShown().l"
                     [valueText]="hslLightnessText()"
                     [track]="hslLightnessTrack()"
                     (valueChange)="hslLightnessChanged($event)"
                     (commit)="commit()"/>
  } @else {
    <ct-color-slider label="LIGHTNESS"
                     [min]="0"
                     [max]="100"
                     [step]="0.1"
                     [value]="oklchShown().l"
                     [valueText]="oklchLightnessText()"
                     [track]="oklchLightnessTrack()"
                     (valueChange)="oklchLightnessChanged($event)"
                     (commit)="commit()"/>

    <!-- The maximum follows the gamut rather than a constant; see
         `chromaCeiling`. -->
    <ct-color-slider label="CHROMA"
                     [min]="0"
                     [max]="chromaCeiling()"
                     [step]="0.001"
                     [value]="oklchShown().c"
                     [valueText]="oklchChromaText()"
                     [track]="oklchChromaTrack()"
                     (valueChange)="oklchChromaChanged($event)"
                     (commit)="commit()"/>

    <ct-color-slider label="HUE"
                     [min]="0"
                     [max]="hueMax"
                     [step]="1"
                     [value]="oklchShown().h"
                     [valueText]="oklchHueText()"
                     [track]="oklchHueTrack()"
                     (valueChange)="oklchHueChanged($event)"
                     (commit)="commit()"/>
  }
</div>
