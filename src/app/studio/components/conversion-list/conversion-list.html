@for (row of rows(); track row.space) {
  <li>
    <!-- The visually hidden word is what makes the accessible name say what the
         button does. It comes first so the name reads "Copy HEX #3366CC"; an
         aria-label would have to repeat the value to keep the visible text
         inside the name. -->
    <button type="button"
            class="flex min-h-11 w-full cursor-pointer flex-wrap items-center gap-x-3 gap-y-1 border-b border-line px-1 py-2 text-left hover:bg-field focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current"
            (click)="copyRow(row.value)">
      <span class="sr-only">Copy&ngsp;</span>
      <span class="min-w-16 shrink-0 font-mono text-sm tracking-widest text-dim">{{ row.label }}&ngsp;</span>
      <span class="min-w-0 font-mono text-base break-all">{{ row.value }}</span>
    </button>
  </li>
}
