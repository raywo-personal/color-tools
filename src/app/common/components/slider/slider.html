<div class="mb-2 flex items-baseline justify-between gap-3">
  <label class="font-sans text-sm tracking-widest text-dim"
         [attr.for]="inputId">{{ label() }}</label>

  <span class="font-mono text-base">{{ valueText() }}</span>
</div>

<!-- The grab area is the full h-11; the visible track is the strip drawn in
     the middle of it by slider.css. The focus ring is inset rather than drawn
     around the track, so on a color axis it runs over the panel instead of
     over the visitor's own color. -->
<input type="range"
       class="h-11 w-full cursor-pointer focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current disabled:cursor-not-allowed"
       [id]="inputId"
       [min]="min()"
       [max]="max()"
       [step]="step()"
       [disabled]="disabled()"
       [attr.aria-valuetext]="valueText()"
       [attr.aria-describedby]="description() ? descriptionId : null"
       [style.--ct-track-image]="track()"
       [(ngModel)]="value"
       (change)="commit.emit()">

@if (description()) {
  <p class="mt-1 font-sans text-sm text-dim"
     [id]="descriptionId">{{ description() }}</p>
}
