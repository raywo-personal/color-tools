<div class="mb-2 flex items-baseline justify-between gap-3">
  <label class="font-sans text-sm tracking-widest text-dim"
         [attr.for]="inputId">{{ label() }}</label>

  <span class="font-mono text-base">{{ valueText() }}</span>
</div>

<!-- The grab area is the full h-11; the visible track is the strip drawn in
     the middle of it by color-slider.css. The focus ring is inset rather than
     drawn around the track, so it runs over the panel instead of over the
     visitor's own color. -->
<input type="range"
       class="h-11 w-full cursor-pointer focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current"
       [id]="inputId"
       [min]="min()"
       [max]="max()"
       [step]="step()"
       [attr.aria-valuetext]="valueText()"
       [style.--ct-track-image]="track()"
       [(ngModel)]="value"
       (change)="commit.emit()">
