<h1 class="m-0 font-serif text-3xl leading-none font-normal tracking-tight sm:text-4xl">Color Tools</h1>

<nav class="flex flex-col overflow-hidden rounded-xs border border-line sm:flex-row" aria-label="Views">
  <a routerLink="/"
     class="flex h-11 items-center justify-center px-5 font-sans text-base focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current sm:justify-start"
     [class.bg-text]="studioActive()"
     [class.text-bg]="studioActive()"

     class="flex h-11 items-center justify-center px-5 font-sans text-base focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current sm:justify-start"
     [class.bg-text]="contrastActive()"
     [class.text-bg]="contrastActive()"
     [class.text-text]="!contrastActive()"
     [attr.aria-current]="contrastActive() ? 'page' : null">CONTRAST &amp; TYPE</a>
</nav>
