<p class="font-sans text-sm tracking-widest text-dim">{{ caption() }}</p>

<!-- Right-aligned, so the figure shares an edge with the verdict in the row
     below it: the two are readings of the same number and line up as one
     column. The unit leads, as it does in APCA's own notation, and is set at
     half the figure rather than at the draft's caption size - at `text-sm` it
     read as a label beside the number instead of as its unit. -->
<p data-figure class="mt-2 flex items-baseline justify-end gap-2">
  <span class="font-sans text-2xl tracking-widest text-dim">Lc</span>
  <span class="font-serif text-5xl leading-none">{{ figure() }}</span>
</p>

<!-- The whole page's tally, and the legend for the marks beside the preview in
     one - which is why each state gets a line rather than the draft's single
     row of glyphs. A tick and a cross can be read off a page; an arrow cannot,
     and this is the one place all four shapes stand together, so it is where
     they get their words.

     `role="list"`, because Preflight strips the marker and Safari with
     VoiceOver then stops announcing the element as a list. -->
<ul role="list"
    aria-label="Verdicts on the page"
    class="mt-4 grid gap-1">
  @for (entry of counts(); track entry.state) {
    <li class="flex items-center gap-2 text-sm"
        [class.text-text]="entry.count > 0"
        [class.text-dim]="entry.count === 0">
      <ct-verdict-shape class="size-4" [state]="entry.state"/>
      <span class="w-6 font-mono tabular-nums">{{ entry.count }}</span>
      <span>{{ entry.word }}</span>
    </li>
  }
</ul>

<!-- The element that sets the figure. The verdict is pushed right by `ml-auto`
     rather than by a column of a fixed width: at the narrow end of the column
     the row wraps instead of truncating. -->
<p class="mt-5 flex flex-wrap items-center gap-x-3 gap-y-1"
   [class.text-text]="row().state === 'pass'"
   [class.text-dim]="row().state !== 'pass'">
  <ct-verdict-shape class="size-4" [state]="row().state"/>

  <span class="font-sans text-sm tracking-widest">{{ row().caption }}</span>

  <!-- The spec and the verdict carry `text-text` themselves rather than
       taking the row's colour: `dim` reaches Lc 68.4 against `bg` in the
       light theme and 50.9 in the dark one, and this very row can ask Lc 100
       at 14px - a row saying `Needs Lc 100` would sit below the bar it
       announces. The caption keeps the row's colour, as the all-caps label
       does in `palette-swatches` and `conversion-list`. -->
  <span class="font-mono text-sm text-text">{{ row().spec }}</span>

  <span class="ml-auto text-sm text-text">{{ row().verdict }}</span>
</p>

<!-- Label and value, the same shape the opened verdicts use: the size that
     would carry the element, and what the pair itself reaches. Both are the
     visitor's own - two sliders and the two colours the screen is named after.

     `role="list"` for the reason the legend above carries it. -->
<ul role="list" class="mt-3 grid gap-1">
  @for (fact of facts(); track fact.label) {
    <!-- No `flex-wrap`, as in the popup: a value too long for the row would
         jump under its own label instead of wrapping in its own column. -->
    <li class="flex items-baseline gap-x-2 text-sm">
      <span class="w-28 shrink-0 text-dim">{{ fact.label }}</span>
      <span class="min-w-0 font-mono text-text">{{ fact.value }}</span>
    </li>
  }
</ul>
