<p class="font-sans text-sm tracking-widest text-dim">{{ caption() }}</p>

<!-- The tally on the left, the figure on the right. The figure stays
     right-aligned so it shares an edge with the verdict in the row below it:
     the two are readings of the same number and line up as one column. The
     unit leads, as it does in APCA's own notation, and is set at half the
     figure rather than at the draft's caption size - at `text-sm` it read as
     a label beside the number instead of as its unit.

     `data-figure` and `data-counts` because both groups are spans of numbers
     in one paragraph, and a spec reading them by position would swap them the
     day a shape moves. -->
<p class="mt-2 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-3">
  <!-- What the four numbers count. The shapes and the marks beside the
       preview say it to an eye; read out under a caption naming a role, four
       bare numbers would sound like that role's own. The announcement opens
       with the same words. -->
  <span class="sr-only">On the page:</span>

  <!-- The four tallies of the whole page - the count of the marks beside the
       preview. Each shape carries a word for a screen reader: the shape says
       it to an eye, and `role`/`aria-label` have nothing to attach to on a
       bare span. -->
  <span data-counts class="flex flex-wrap items-center gap-x-3 gap-y-1">
    @for (entry of counts(); track entry.state) {
      <span class="flex items-center gap-1.5 font-sans text-sm text-dim">
        <ct-verdict-shape class="size-4" [state]="entry.state"/>
        <span>{{ entry.count }}</span>
        <span class="sr-only">{{ entry.word }}</span>
      </span>
    }
  </span>

  <span data-figure class="flex items-baseline gap-2">
    <span class="font-sans text-2xl tracking-widest text-dim">Lc</span>
    <span class="font-serif text-5xl leading-none">{{ figure() }}</span>
  </span>
</p>

<!-- The element that sets the figure. The verdict is pushed right by `ml-auto`
     rather than by a column of a fixed width: at the narrow end of the column
     the row wraps instead of truncating. -->
<p class="mt-4 flex flex-wrap items-center gap-x-3 gap-y-1"
   [class.text-text]="row().state === 'pass'"
   [class.text-dim]="row().state !== 'pass'">
  <ct-verdict-shape class="size-4" [state]="row().state"/>

  <span class="font-sans text-sm tracking-widest">{{ row().caption }}</span>

  <!-- The spec and the verdict carry `text-text` themselves rather than
       taking the row's colour: `dim` reaches Lc 68.4 against `bg` in the
       light theme and 50.9 in the dark one, and this very row can ask Lc 100
       at 14px - a row saying `Needs Lc 100` would sit below the bar it
       announces. The caption keeps the row's colour, as the all-caps label
       does in `palette-swatches` and `conversion-list`. -->
  <span class="font-mono text-sm text-text">{{ row().spec }}</span>

  <span class="ml-auto text-sm text-text">{{ row().verdict }}</span>
</p>

<p class="mt-3 text-sm text-dim text-pretty">{{ note() }}</p>

<p class="mt-3 text-sm text-dim">{{ pairNote() }}</p>
