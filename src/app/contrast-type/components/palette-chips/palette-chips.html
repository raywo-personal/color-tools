<!-- The caption and the two chips wrap together, so in the narrow column the
     target takes the rows it needs rather than squeezing past its hit area. -->
<div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-2">
  <p class="font-sans text-sm tracking-widest text-dim">APPLY TO</p>

  <div role="group"
       aria-label="Apply a color to"
       class="flex flex-wrap gap-2">
    @for (option of options; track option.role) {
      <!-- aria-pressed, not colour alone: the inverted chip is the only other
           thing telling a visitor which half of the pair the row below sets. -->
      <button type="button"
              class="h-11 cursor-pointer rounded-xs border px-3 font-sans text-base focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-current"
              [class.border-text]="target() === option.role"
              [class.bg-text]="target() === option.role"
              [class.text-bg]="target() === option.role"
              [class.border-line]="target() !== option.role"
              [class.text-text]="target() !== option.role"
              [attr.aria-pressed]="target() === option.role"
              (click)="pickTarget(option.role)">{{ option.caption }}</button>
    }
  </div>
</div>

<!-- Seven in one row at every width, unlike the Studio's palette: the chips are
     h-11 rather than square, so the touch minimum is met by their height. The
     shell's px-4 leaves 288px of a 320px screen, and seven across it with the
     six gaps leave 37px each.

     **37px is the narrowest a chip gets, and it is short of the width the hit
     area asks for.** The rule wants h-11 in both directions; here the height
     carries the touch minimum and the width is what one row of seven leaves at
     320px. Do not buy the width back out of the gap: the ring is offset off
     the chip and the 4px gap is what it lands on - 2px of offset plus 2px of
     ring reach exactly to the neighbour's edge, so all four sides sit on the
     page ground where the text token always shows. A narrower gap puts a chip's
     ring on its neighbour's colour.

     `T` and `BG` come last and in the pair's own order, so the two chips stand
     under the two fields whose initials they carry. -->
<ul role="list"
    aria-label="Palette colors and the pair"
    class="grid grid-cols-7 gap-1">
  @for (chip of chips(); track chip.source) {
    <li class="min-w-0">
      <!-- One button, two gestures - the component says how they are kept
           apart. `cdkDrag` with no drop list: the elements that answer a carry
           live in the preview's own component tree, so the two halves talk
           through `carriedChip` in the store rather than through a connected
           list that would have to cross both trees.

           `pointerdown` and `keydown` both mark the start of a gesture, which
           is where the drag flag is cleared. Neither may be folded into the
           click: by the time a click arrives the browser has forgotten which
           one produced it.

           `pointer-events-none` while the chip is out is what makes a drop
           land on the element under the pointer rather than on the chip
           itself - see `dragging`.

           `relative z-30` on the carried chip alone, so it stays on top of
           what it is carried over. The preview is `sticky` from `lg`, which
           puts it in the positioned layer and paints it over anything still in
           the flow - the chip went under it halfway across and the visitor lost
           sight of what they were holding. **On the row rather than on the one
           chip it lifted nothing**: seven chips on one z-index in one stacking
           context are painted in document order, so each one to the right of
           the carried chip covered it - see `draggedChip`. The z-index costs
           the drop nothing: a hit test skips an element with
           `pointer-events: none` whatever it paints over, which is what
           `dragging` rests on. -->
      <button type="button"
              cdkDrag
              [cdkDragStartDelay]="dragStartDelay"
              class="flex h-11 w-full cursor-pointer items-end justify-center rounded-xs border border-line pb-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-current"
              [class.pointer-events-none]="dragging()"
              [class.relative]="draggedChip() === chip.source"
              [class.z-30]="draggedChip() === chip.source"
              [style.background-color]="chip.background"
              [attr.aria-label]="chip.label"
              (pointerdown)="onGestureStart()"
              (keydown)="onGestureStart()"
              (cdkDragStarted)="onDragStarted(chip)"
              (cdkDragEnded)="onDragEnded($event)"
              (click)="apply(chip)">
        <!-- The handle, in whichever of black and white APCA puts further from
             the chip: it is drawn on a colour the visitor picked, so the
             draft's fixed white would vanish on a light `BG`. Bottom-aligned as
             the draft has it, which keeps it clear of the chip's own colour at
             the centre where the eye reads the hue.

             `aria-hidden`, because the button's own name already opens with
             this text - see the label in `palette-chips.ts`. -->
        <span class="font-mono text-sm leading-none"
              aria-hidden="true"
              [style.color]="chip.ink">{{ chip.handle }}</span>
      </button>
    </li>
  }
</ul>
