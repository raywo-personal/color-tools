<!-- The row: the mark's column, then the element. `items-start` rather than
     `items-baseline`, and that is what makes the hit areas safe - the button is
     centred 10px below the row's top edge in every row, so `min-h-11` puts two
     consecutive centres at least a hit area apart. Aligned to the first line's
     baseline instead, a 96px headline over an 18px lead would pull two 44px
     buttons into each other.

     Inline, none of it applies: a word inside a paragraph cannot indent, and a
     44px inline box would open a gap in the line it sits in. -->
<span class="gap-2"
      [class.flex]="!inline()"
      [class.min-h-11]="!inline()"
      [class.items-start]="!inline()"
      [class.inline]="inline()">
  <!-- The badge's slot is `size-5` and costs 20px of layout; the button is
       centred on it at the full `size-11`, out of flow, so the page indents by
       one and three quarter rem while the control keeps the app's hit area. -->
  <span class="relative size-5"
        [class.shrink-0]="!inline()"
        [class.inline-block]="inline()"
        [class.mr-1]="inline()">
    <!-- The button is the hit area and nothing else: transparent, out of flow,
         and reaching past the badge on every side. What the visitor sees is
         the badge inside it. -->
    <button type="button"
            cdkOverlayOrigin
            #origin="cdkOverlayOrigin"
            #markButton
            aria-haspopup="dialog"
            class="group absolute top-1/2 left-1/2 flex size-11 -translate-x-1/2 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full focus-visible:outline-2 focus-visible:outline-offset-2"
            [style.outline-color]="inkHex()"
            [attr.aria-label]="label()"
            [attr.aria-expanded]="open()"
            [attr.aria-describedby]="open() ? panelId() : null"
            (click)="toggle()">
      <!-- The badge is the app's surface, not the page's: `panel` and `text`
           are an app pair, guaranteed against each other, and they say the
           mark belongs to ColorTools rather than to the page it judges - the
           same thing the popup it opens says, in the same colours. A bare
           glyph in the page's ink was the page's own punctuation and nobody
           took it for a control. `field` on hover is the app's own hover
           surface; the badge changes under the pointer, which a glyph could
           not.

           Only the rim and the focus ring still come from APCA, because they
           are the edge against the visitor's colour: `line` is guaranteed
           against the six app surfaces and against none of theirs, so on a
           page of the same lightness the badge would have no outline at all.
           The ring's offset lands on that same page colour. -->
      <span class="flex size-5 items-center justify-center rounded-full border bg-panel text-text shadow-sm group-hover:bg-field"
            [style.border-color]="inkHex()">
        <ct-verdict-shape class="size-3.5" [state]="verdict().state"/>
      </span>
    </button>
  </span>

  <!-- The dotted underline is the element's own carrier, beside the mark: a
       shape in a gutter is not the line it judges. On the wrapper, because
       text decoration propagates into everything in flow below it and the
       element itself is the caller's markup.

       The outline is the same wrapper's: dashed while a colour may be put
       here, solid on the one the pointer is on. It is drawn in the colour APCA
       chose against the surface the element sits on, because `line` is
       guaranteed against the app's six and against none of the visitor's.
       `outline` rather than `border`, so nothing in the page moves when it
       appears - the offset puts it clear of the words either way. -->
  <!-- `data-place-sides` while a chip is carried: it is what splits this box
       into the half that takes the text colour and the half that takes the
       ground. One attribute for both halves of the job - `src/styles.css`
       draws the hairline off it and `PlacementGesture` measures the release
       against the same box. On the outlined copy rather than on the host,
       because the host is the whole row and its midline is not the middle of
       the words.

       The line is the one piece of chrome that is not measured against the
       surface: it is drawn inside the box, so it takes `splitHex()`, which
       says why. -->
  <span data-content
        class="relative outline-offset-4"
        [class.block]="!inline()"
        [class.min-w-0]="!inline()"
        [class.flex-1]="!inline()"
        [class.underline]="missed()"
        [class.decoration-dotted]="missed()"
        [class.underline-offset-4]="missed()"
        [class.outline-2]="named()"
        [class.outline-dashed]="dashed()"
        [attr.data-place-sides]="carrying() ? '' : null"
        [style.--place-split-color]="splitHex()"
        [style.outline-color]="inkHex()">
    <!-- The element's name where the outline is, so the page says what the
         chip would land on without the visitor reading the ledger, and - while
         the chip is over this element - which of its two colours the release
         would take. The side belongs here rather than in each half of the
         split: a word inside the half of a link in a line has nowhere to go,
         and the badge is already the one label the page shows. The app's
         badge again, rimmed in the measured colour - a label in the page's own
         ink would be text the visitor had apparently written.

         Out of flow, for the popup's reason: a label in the flow would push
         the page it names.

         **Under the element, where the draft draws it over.** The page's own
         `overflow-hidden` is what decides it: the nav's three elements sit one
         rem below the top edge and a badge above them would be cut in half,
         while every element has the rest of its own hit-area row underneath.
         Do not move it back up without giving the page room at the top first.

         `aria-hidden`, because the mark's own name already carries the
         element and a screen reader would otherwise hear it twice. -->
    @if (named()) {
      <span data-element-name
            aria-hidden="true"
            class="absolute -bottom-7 left-0 z-10 rounded-xs border bg-panel px-1.5 py-0.5 font-mono text-sm tracking-widest whitespace-nowrap text-text"
            [style.border-color]="inkHex()">{{ badge() }}</span>
    }<ng-content/></span>
</span>

<!-- The verdict as a popup rather than a block in the flow: in the flow it
     pushed the page it was about downwards, and inside a table cell it
     re-apportioned the columns. On the body it moves nothing, and the
     preview's `overflow-hidden` cannot clip it.

     No backdrop: a full-viewport backdrop element would absorb the very
     click meant for the next mark, so comparing two elements cost a dead
     click to close the first popup before the second would open. Closing on
     `overlayOutsideClick` instead reaches the same "a click anywhere closes
     it without a scrim". The mechanism is a `click` listener on the body in
     the capture phase, not the `pointerdown` - that one only records where
     the press began - so the close runs before the click reaches whatever
     sits underneath in the bubble phase, and the next mark opens in the same
     press.

     **A drop closes an open verdict through this same listener, so nothing may
     stop that click any earlier.** A drag presses on a chip and releases on an
     element, so the browser fires the click at the two targets' common
     ancestor, which is outside the overlay - and that is what clears a popup
     opened before the drop. Add a `click` handler on the document, or anywhere
     in the capture phase ahead of the body's, and the verdict of whatever
     element was open hangs over the page the visitor has just recoloured until
     they press Escape.

     `detach` is what carries the scroll strategy's own close back into the
     store: scroll the app's page until the overlay has left the window and
     `autoClose` disposes it, so without this the store would go on holding a
     verdict nobody can see. Scrolling the *preview* is the other case, and
     `VerdictMark` closes that one itself - the strategy cannot see the
     container. -->
<ng-template cdkConnectedOverlay
             [cdkConnectedOverlayOrigin]="origin"
             [cdkConnectedOverlayOpen]="open()"
             [cdkConnectedOverlayPositions]="positions"
             [cdkConnectedOverlayViewportMargin]="8"
             [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
             (overlayOutsideClick)="close()"
             (detach)="close()"
             (overlayKeydown)="onOverlayKeydown($event)">
  <!-- One popup with two blocks, not two popups off one element: what the
       element is now, and the colours it can be given. They are the same
       question asked twice, and the draft's own chooser already carried a
       verdict line. A dialog because it holds controls and takes focus; the
       label is where the mark's two jobs are said, since a name spoken on
       every pass through the page cannot carry them.

       `cdkTrapFocus` without auto-capture: the chooser puts focus on a chip
       itself, and the trap is only here so `Tab` cannot walk out of a popup
       that renders at the end of the body. Escape hands focus back - see
       `onOverlayKeydown`. -->
  <div role="dialog"
       cdkTrapFocus
       class="grid gap-2"
       [attr.aria-label]="dialogLabel()">
    <ct-verdict-panel [id]="panelId()" [elementKey]="elementKey()"/>
    <ct-color-chooser [elementKey]="elementKey()"/>
  </div>
</ng-template>
