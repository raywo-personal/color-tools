<div class="min-w-0">
  <ct-pair-fields/>

  <ct-palette-chips class="mt-6"/>

  <ct-pair-actions class="mt-6"/>

  <!-- How the page stands with this pair - the count of the marks beside the
       preview, and the legend that teaches their shapes. It closes the pair's
       block rather than opening one of its own: it is about the two colours
       above it, not about the role selected below. -->
  <ct-page-verdicts class="mt-6"/>

  <!-- A rule above each block, as the draft draws them: the type roles with
       the rating under them, the type controls and the colour-vision block
       are their own blocks under the pair, not further rows of it. The rating
       sits directly under the segments without a rule of its own, because it
       answers about the role they select. -->
  <ct-type-roles class="mt-6 border-t border-line pt-5"/>

  <ct-apca-rating class="mt-5"/>

  <ct-type-controls class="mt-6 border-t border-line pt-5"/>

  <!-- The record of what the visitor put on the page, and the two resets that
       undo it. After the whole type block and before the vision one, as the
       draft's 1a places it: it is about the colours on the page, so it comes
       once the type is settled and stands beside the block that asks the other
       question about those same colours. -->
  <ct-placed-colors class="mt-6 border-t border-line pt-5"/>

  <ct-color-vision class="mt-6 border-t border-line pt-5"/>
</div>
