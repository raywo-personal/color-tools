<!-- The colour column: the pair, the ways to get one, how the page stands with
     it, what the visitor put on it, and what a colour-vision deficiency does
     to the palette.

     **A ruled break is `mt-5` over `pt-4`, an unruled one `mt-6`.** The type
     column has to reach the third slider above a laptop's fold and the header
     and the rating gave up the rest of what that took; the same rhythm runs
     down this column because a rule four pixels tighter than the one across
     the aisle is the kind of thing that reads as an accident. -->
<div class="min-w-0">
  <ct-pair-fields/>

  <ct-palette-chips class="mt-6" [(target)]="target"/>

  <!-- Directly under the chips, because `APPLY TO` steers both: the half a
       click applies a chip to is the half these three tracks move. Anything
       between them would put the two controls of one mode on either side of
       an unrelated block. -->
  <ct-pair-sliders class="mt-6" [target]="target()"/>

  <ct-pair-actions class="mt-6"/>

  <!-- How the page stands with this pair - the count of the marks beside the
       preview, and the legend that teaches their shapes. It closes the pair's
       block rather than opening one of its own: it is about the two colours
       above it, not about the role selected in the type column. -->
  <ct-page-verdicts class="mt-6"/>

  <!-- The record of what the visitor put on the page, and the two resets that
       undo it. It asks about the same colours as the pair above it, so it
       stands with them in this column rather than with the type: everything
       about the page's colours is in one run. -->
  <ct-placed-colors class="mt-5 border-t border-line pt-4"/>

  <!-- Last in the column, because it is a thing to look up rather than a way
       to get a pair: it reports on the palette the chips above are drawn
       from. -->
  <ct-color-vision class="mt-5 border-t border-line pt-4"/>
</div>

<!-- The type column: the role, how the page's elements in it fare, and the
     type they are set in.

     Its own rule and top margin belong to the narrow layouts, where it is the
     block under the colours; from `xl` it is a column of its own and a rule
     across the top of a column says nothing. -->
<div class="mt-5 min-w-0 border-t border-line pt-4 xl:col-start-3 xl:row-start-1 xl:mt-0 xl:border-t-0 xl:pt-0">
  <ct-type-roles/>

  <!-- Directly under the segments and without a rule of its own, because it
       answers about the role they select. -->
  <ct-apca-rating class="mt-4"/>

  <ct-type-controls class="mt-5 border-t border-line pt-4"/>
</div>

<!-- `mt-8` only while it is stacked under the controls: from `lg` it stands
     beside them, at the top of a column of its own. -->
<ct-website-preview class="mt-8 lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:mt-0 xl:row-span-1"/>
